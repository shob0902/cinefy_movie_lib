<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ff4d00" />
    <meta
      name="description"
      content="Browse, search and save films. A movie discovery app built on TMDB."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Archivo Black for display, Space Mono for metadata, Inter for body copy.
         Preconnected so the first paint is not held behind a cold TLS handshake. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap"
    />
    <!-- Warm up the DNS/TLS handshake for the poster CDN before the first card renders. -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <title>Cinefy — Movie Discovery</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
